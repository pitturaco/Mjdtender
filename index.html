html{scroll-padding-top:env(safe-area-inset-top,0px)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);padding:12px 16px 0}
h1{margin:0 0 10px;font-size:20px;font-weight:700}
.search{width:100%;border:0;border-radius:10px;padding:10px 14px;font:inherit;background:var(--surface);color:var(--ink)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;padding:10px 4px;opacity:.75;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{opacity:1;border-color:currentColor;font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}

.note button{flex:none}.note{flex-wrap:wrap}
.card{display:flex;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0;overflow:hidden;font:inherit;color:inherit;cursor:pointer}

.days b{font-size:28px;line-height:1.1;font-weight:700}

.days.soon{color:var(--warn)}.days.urgent{color:var(--bad)}.days.over{color:var(--mute)}
.body{padding:10px 12px;min-width:0;flex:1}

.org{color:var(--brand);font-weight:500;font-size:13px}

.empty{text-align:center;color:var(--mute);padding:40px 10px}
.group{margin:16px 0 6px;font-weight:700;font-size:14px;color:var(--mute)}

header{padding:10px 14px 12px}.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}

.mlist{inset-inline:auto;inset-inline-end:0;min-width:210px}

.msep{height:6px;background:var(--bg)}

var SRCS=["parc","jobs","ptenders"],ERR={};

async function loadAll(){var st=document.getElementById("upd");
 for(var i=0;i<SRCS.length;i++){var n=SRCS[i];
  for(var p=1;p<=80;p++){var j;
   try{var r=await fetch("/api/source?name="+n+"&page="+p);if(!r.ok)break;j=await r.json()}catch(e){break}
   var rows=mapRows(j.items||[]);if(rows.length)mergeRows(rows);
   if(st)st.textContent="جارٍ التحديث… "+n+" (صفحة "+p+")";
   if(j.error){ERR[n]=1;break}
   if(j.done||!j.items.length)break;
   if(p>=2&&!rows.some(function(x){return left(x.end)>=0}))break}}
 if(st)st.textContent="آخر تحديث: "+new Date().toLocaleString("ar")+(Object.keys(ERR).length?" — تعذّر: "+Object.keys(ERR).join("، "):"")}
loadAll();setInterval(loadAll,1800000);

render();
